<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="A pixel-art mushroom grove that keeps growing while you're away.">
<meta name="theme-color" content="#06080b">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Spore Hollow</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600&family=Silkscreen&display=swap">
<style>
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; }
body { font: 14px/1.4 system-ui, sans-serif; }
[hidden] { display: none !important; }
/* Layout: one fixed pixel-art clearing filling the screen; HUD floats in the safe-area gutters. Single night look by design. */
:root {
  --void: #06080b;
  --ink: #dbe6d2;
  --dim: #8a9a8f;
  --glow: #8ff7d0;
  --cap: #e0563f;
  --party: #ff5fbf;
  --panel: rgba(6, 9, 12, 0.62);
  --paper: #141a15;
  --rule: rgba(143, 247, 208, 0.05);
  --rule-strong: rgba(219, 230, 210, 0.16);
  --binding: #3a2c22;
  --sketch-bg: #0b1210;
  --display: 'Pixelify Sans', ui-monospace, 'Courier New', monospace;
  --label: 'Silkscreen', ui-monospace, 'Courier New', monospace;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  background: var(--void);
  color: var(--ink);
  overflow: hidden;
  touch-action: manipulation;
  -webkit-user-select: none;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
}
#stage {
  position: fixed; inset: 0;
  display: grid; place-items: center;
  background: var(--void);
  overflow: hidden;
}
#cv {
  display: block;
  image-rendering: pixelated;
  image-rendering: crisp-edges;
  cursor: pointer;
  touch-action: none;
}
.hud {
  position: fixed; left: 0; right: 0;
  display: flex; justify-content: space-between; align-items: flex-start; gap: 12px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  pointer-events: none;
}
.hud.top { top: 0; padding-top: calc(env(safe-area-inset-top, 0px) + 12px); }
.hud.bottom { bottom: 0; justify-content: center; padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 20px); }
.brand { display: grid; gap: 4px; min-width: 0; }
.brand b {
  font: 400 11px/1 var(--label);
  letter-spacing: 0.08em; text-transform: uppercase;
  color: var(--ink); opacity: 0.8;
  text-shadow: 0 1px 0 #000;
}
#status {
  font: 400 10px/1 var(--label);
  letter-spacing: 0.08em; text-transform: uppercase;
  color: var(--dim);
  text-shadow: 0 1px 0 #000;
}
.hright { display: grid; justify-items: end; gap: 8px; }
.hbtns { display: flex; gap: 8px; pointer-events: auto; }
.vbtn { border-color: rgba(219, 230, 210, 0.2); color: var(--dim); }
.vbtn[aria-pressed="true"] { color: var(--ink); border-color: rgba(214, 160, 110, 0.5); }
.hbtn {
  position: relative;
  pointer-events: auto;
  font: 400 10px/1 var(--label);
  letter-spacing: 0.08em; text-transform: uppercase;
  color: var(--ink);
  background: var(--panel);
  border: 1px solid rgba(143, 247, 208, 0.28);
  padding: 9px 11px; min-height: 34px;
  white-space: nowrap;
  border-radius: 0;
  cursor: pointer;
}
#snd[aria-pressed="true"] { border-color: var(--glow); color: var(--glow); }
#jbtn.new::after { content: ""; position: absolute; top: -3px; right: -3px; width: 6px; height: 6px; background: var(--cap); box-shadow: 0 0 6px var(--cap); }
#journal {
  position: fixed; inset: 0; z-index: 5;
  display: grid; place-items: center;
  background: rgba(3, 5, 7, 0.72);
  padding: calc(env(safe-area-inset-top, 0px) + 16px) max(16px, env(safe-area-inset-right, 0px)) calc(env(safe-area-inset-bottom, 0px) + 16px) max(16px, env(safe-area-inset-left, 0px));
}
.jbook {
  width: min(560px, 100%);
  max-height: 100%;
  overflow-y: auto;
  overscroll-behavior: contain;
  background: var(--paper);
  background-image: repeating-linear-gradient(to bottom, transparent 0 27px, var(--rule) 27px 28px);
  border: 2px solid var(--binding);
  box-shadow: 0 0 0 2px #000, 6px 6px 0 #000;
  padding: 0 18px 22px;
}
.jhead {
  position: sticky; top: 0; z-index: 1;
  display: flex; justify-content: space-between; align-items: center; gap: 12px;
  background: var(--paper);
  padding: 16px 0 12px;
  border-bottom: 2px solid var(--binding);
}
.jhead h2 { margin: 0 0 4px; font: 600 24px/1 var(--display); color: var(--ink); }
#jcount { font: 400 10px/1 var(--label); letter-spacing: 0.08em; text-transform: uppercase; color: var(--glow); }
.jsec { margin: 22px 0 6px; font: 400 10px/1 var(--label); letter-spacing: 0.1em; text-transform: uppercase; color: var(--dim); }
.jentry {
  display: grid; grid-template-columns: 72px minmax(0, 1fr); gap: 14px; align-items: start;
  padding: 14px 0;
  border-top: 1px dashed var(--rule-strong);
}
.jsketch { width: 72px; height: 60px; image-rendering: pixelated; background: var(--sketch-bg); border: 1px solid var(--rule-strong); }
.jtext { display: grid; gap: 4px; min-width: 0; }
.jtext h4 { margin: 0; font: 600 18px/1.15 var(--display); color: var(--ink); text-wrap: balance; }
.jtext p { margin: 0; }
.jsub { font: 400 14px/1.2 var(--display); font-style: italic; color: var(--glow); opacity: 0.85; }
.jnote { font: 400 15px/1.4 var(--display); color: var(--ink); opacity: 0.88; }
.jmeta { margin-top: 4px !important; font: 400 9px/1.4 var(--label); letter-spacing: 0.08em; text-transform: uppercase; color: var(--dim); font-variant-numeric: tabular-nums; }
.jentry.locked h4 { color: var(--dim); font-size: 15px; }
.held {
  pointer-events: auto;
  display: flex; align-items: stretch;
  margin-top: 6px; max-width: 196px;
  background: var(--panel);
  border: 1px solid rgba(143, 247, 208, 0.45);
  box-shadow: 0 0 10px rgba(143, 247, 208, 0.15);
}
.held button { background: none; border: 0; border-radius: 0; color: var(--ink); cursor: pointer; font: 400 10px/1.35 var(--label); letter-spacing: 0.08em; text-transform: uppercase; text-align: left; }
.heldmain { display: flex; align-items: center; gap: 7px; padding: 5px 8px 5px 5px; min-width: 0; }
.heldgo { padding: 0 8px; color: var(--dim) !important; border-left: 1px solid var(--rule-strong) !important; font-size: 9px !important; white-space: nowrap; }
.held canvas { width: 28px; height: 28px; image-rendering: pixelated; flex: none; }
.held small { display: block; color: var(--glow); font-size: 9px; text-transform: none; letter-spacing: 0.04em; }
.jhint { margin: 0 0 4px; font: 400 15px/1.4 var(--display); color: var(--dim); font-style: italic; }
.pgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(84px, 1fr)); gap: 16px 10px; padding: 10px 0 6px; }
.pcell { margin: 0; display: grid; justify-items: center; align-content: start; gap: 7px; text-align: center; }
.pprint { width: 64px; height: 64px; image-rendering: pixelated; border: 1px solid var(--rule-strong); box-shadow: 2px 2px 0 #000; }
.pcell figcaption { font: 400 13px/1.2 var(--display); color: var(--ink); text-wrap: balance; }
.pcell figcaption small { display: block; margin-top: 2px; font: 400 9px/1 var(--label); letter-spacing: 0.08em; color: var(--dim); font-variant-numeric: tabular-nums; }
.pcell.locked .pprint { background: transparent; border-style: dashed; box-shadow: none; }
.pcell.locked figcaption { color: var(--dim); font-style: italic; }
.jentry.locked .jnote { color: var(--dim); font-style: italic; }
#log {
  font: 400 16px/1.35 var(--display);
  color: var(--ink);
  text-align: center;
  max-width: 30ch;
  text-wrap: balance;
  text-shadow: 0 1px 0 #000, 0 0 8px rgba(0,0,0,0.8);
  opacity: 0;
  transition: opacity 1.2s ease;
}
#gate {
  position: fixed; inset: 0;
  display: grid; place-items: center;
  background: rgba(4, 6, 9, 0.58);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.gate-inner { display: grid; gap: 18px; justify-items: center; text-align: center; max-width: 320px; }
.gate-inner h1 {
  margin: 0;
  font: 600 46px/0.95 var(--display);
  letter-spacing: 0.01em;
  color: var(--ink);
  text-wrap: balance;
  text-shadow: 0 3px 0 #000, 0 0 24px rgba(143, 247, 208, 0.25);
}
.gate-inner h1 span { color: var(--glow); }
.gate-inner p {
  margin: 0;
  font: 400 16px/1.4 var(--display);
  color: var(--dim);
  text-wrap: balance;
}
.gate-actions { display: grid; gap: 10px; width: 100%; margin-top: 6px; }
.gate-actions button {
  font: 400 12px/1 var(--label);
  letter-spacing: 0.08em; text-transform: uppercase;
  padding: 15px 16px;
  border-radius: 0;
  cursor: pointer;
}
#enterSound { background: var(--glow); color: #04120c; border: 0; box-shadow: 0 4px 0 #2d7d63; }
#enterSound:active { transform: translateY(2px); box-shadow: 0 2px 0 #2d7d63; }
#enterQuiet { background: transparent; color: var(--ink); border: 1px solid rgba(219, 230, 210, 0.3); }
button:focus-visible { outline: 2px solid var(--cap); outline-offset: 3px; }
.hint { font: 400 10px/1.5 var(--label); letter-spacing: 0.08em; text-transform: uppercase; color: var(--dim); opacity: 0.8; }
</style>
</head>
<body>
<div id="stage"><canvas id="cv" aria-label="A mossy night grove where mushrooms grow on their own"></canvas></div>

<div class="hud top">
  <div class="brand"><b>Spore Hollow</b><span id="status">Night</span>
    <div id="held" class="held" hidden>
      <button id="heldmain" class="heldmain" type="button"><canvas id="heldc" width="24" height="24"></canvas><span id="heldt"></span></button>
      <button id="heldgo" class="heldgo" type="button">Let go</button>
    </div>
  </div>
  <div class="hright">
    <div class="hbtns">
      <button id="jbtn" class="hbtn" type="button">Journal</button>
      <button id="snd" class="hbtn" type="button" aria-pressed="false">Sound off</button>
    </div>
    <button id="vbtn" class="hbtn vbtn" type="button" aria-pressed="false">Go below</button>
  </div>
</div>

<div id="journal" hidden role="dialog" aria-modal="true" aria-labelledby="jtitle">
  <div class="jbook">
    <header class="jhead">
      <div><h2 id="jtitle">Field Journal</h2><span id="jcount"></span></div>
      <button id="jclose" class="hbtn" type="button">Close</button>
    </header>
    <div id="jlist"></div>
  </div>
</div>
<div class="hud bottom"><div id="log" role="status" aria-live="polite"></div></div>

<div id="gate">
  <div class="gate-inner">
    <h1>Spore<br><span>Hollow</span></h1>
    <p>A clearing that grows while you're gone. Something is dancing past the cedars.</p>
    <div class="gate-actions">
      <button id="enterSound" type="button">Enter with sound</button>
      <button id="enterQuiet" type="button">Enter quietly</button>
    </div>
    <span class="hint">Headphones help</span>
  </div>
</div>

<script>
(() => {
'use strict';
const cv = document.getElementById('cv');
let ctx = cv.getContext('2d');
const bg = document.createElement('canvas');
const bctx = bg.getContext('2d');
const logEl = document.getElementById('log');
const statusEl = document.getElementById('status');
const sndBtn = document.getElementById('snd');
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

let W = 200, H = 400, S = 2, G = {};

/* ---------- helpers ---------- */
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function hash(n){const x=Math.sin(n*12.9898)*43758.5453;return x-Math.floor(x);}
const BAYER=[[0,8,2,10],[12,4,14,6],[3,11,1,9],[15,7,13,5]];
const mix=(a,b,t)=>[a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t,a[2]+(b[2]-a[2])*t];
const rgb=(c,a)=>a===undefined?`rgb(${c[0]|0},${c[1]|0},${c[2]|0})`:`rgba(${c[0]|0},${c[1]|0},${c[2]|0},${a})`;
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const shade=(c,f)=>[c[0]*f,c[1]*f,c[2]*f];
const BROWN=[64,48,38];
function R(x,y,w,h,c,a){ctx.fillStyle=rgb(c,a);ctx.fillRect(Math.round(x),Math.round(y),w,h);}
function glow(x,y,r,c,a){if(a<=0.01||r<=0)return;const g=ctx.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,rgb(c,a));g.addColorStop(1,rgb(c,0));ctx.fillStyle=g;ctx.fillRect(x-r,y-r,r*2,r*2);}

/* ---------- the real sky over Vernon, BC ---------- */
const SITE={lat:50.267,lon:-119.272};
function sunAltitude(ms){
  const rad=Math.PI/180,d=(ms-946728000000)/86400000; // days since J2000
  const g=(357.529+0.98560028*d)*rad,q=280.459+0.98564736*d;
  const lng=(q+1.915*Math.sin(g)+0.020*Math.sin(2*g))*rad,e=(23.439-0.00000036*d)*rad;
  const ra=Math.atan2(Math.cos(e)*Math.sin(lng),Math.cos(lng)),dec=Math.asin(Math.sin(e)*Math.sin(lng));
  const gmst=((18.697374558+24.06570982441908*d)%24+24)%24;
  const ha=(gmst*15+SITE.lon)*rad-ra,lat=SITE.lat*rad;
  return Math.asin(Math.sin(lat)*Math.sin(dec)+Math.cos(lat)*Math.cos(dec)*Math.cos(ha))/rad;
}
const SHOWERS=[
  {name:'Quadrantids',m:0,d:3,w:0.6,k:0.8},{name:'Lyrids',m:3,d:22,w:1.2,k:0.4},
  {name:'Eta Aquariids',m:4,d:6,w:3,k:0.45},{name:'Perseids',m:7,d:12,w:3,k:1},
  {name:'Orionids',m:9,d:21,w:3,k:0.6},{name:'Leonids',m:10,d:17,w:1.5,k:0.4},
  {name:'Geminids',m:11,d:14,w:2,k:1}
];
function activeShower(now){
  const y=new Date(now).getFullYear();let best=null,bi=0;
  for(const s of SHOWERS)for(const yr of [y-1,y,y+1]){const days=(now-new Date(yr,s.m,s.d,4).getTime())/864e5;const i=s.k*Math.exp(-(days*days)/(2*s.w*s.w));if(i>bi){bi=i;best=s;}}
  return bi>0.08?{name:best.name,i:bi,dir:hash(best.name.length*7.7)<0.5?-1:1,ang:0.45+hash(best.name.length*3.1)*0.25}:null;
}
let skyCache={t:0};
/* ---------- weather: rain comes in 3-hour spells, same for everyone ---------- */
const HOUR=3600e3,RAIN_BLOCK=3*HOUR,RAIN_FADE=25*60e3;
const RAIN_P=[0.2,0.18,0.16,0.18,0.2,0.18,0.1,0.1,0.14,0.24,0.28,0.24]; // wetter in autumn
function rainy(ms){const b=Math.floor(ms/RAIN_BLOCK);return hash(b*1.371+0.29)<RAIN_P[new Date(ms).getMonth()];}
function rainLevel(ms){if(!rainy(ms))return 0;const b=Math.floor(ms/RAIN_BLOCK),into=ms-b*RAIN_BLOCK;let r=0.55+0.45*hash(b*2.9);
  if(!rainy(ms-RAIN_BLOCK))r*=clamp(into/RAIN_FADE,0,1);if(!rainy(ms+RAIN_BLOCK))r*=clamp((RAIN_BLOCK-into)/RAIN_FADE,0,1);return r;}
function rainAround(ms){return(+rainy(ms)+ +rainy(ms-RAIN_BLOCK)+ +rainy(ms-2*RAIN_BLOCK))/3;}
function sky(){const now=Date.now();if(now-skyCache.t>5000){const alt=sunAltitude(now);skyCache={t:now,alt,rising:sunAltitude(now+6e5)>alt,sh:activeShower(now),rain:rainLevel(now)};}return skyCache;}
function smooth(a,b,x){const t=clamp((x-a)/(b-a),0,1);return t*t*(3-2*t);}
function lightLevel(){const s=sky();return smooth(-9,12,s.alt)*(1-0.32*s.rain);}
function warmth(){const s=sky();return clamp(1-Math.abs(s.alt-1)/7,0,1)*(1-s.rain);}

/* ---------- persistence ---------- */
const KEY='spore-hollow-v1';
function load(){try{return JSON.parse(localStorage.getItem(KEY))||{};}catch(e){return {};}}
const state=load();
const prevVisit=state.last||null;
state.first=state.first||Date.now();
delete state.planted;
state.journal=state.journal&&typeof state.journal==='object'?state.journal:{};
state.colonies=Array.isArray(state.colonies)?state.colonies:[];
state.prints=state.prints&&typeof state.prints==='object'?state.prints:{};
state.held=typeof state.held==='string'?state.held:null;
state.lastWind=state.lastWind||Date.now();
function save(){try{localStorage.setItem(KEY,JSON.stringify({first:state.first,last:Date.now(),journal:state.journal,colonies:state.colonies,prints:state.prints,held:state.held,lastWind:state.lastWind,tips:state.tips,turnTip:state.turnTip}));}catch(e){}}

/* ---------- field journal ---------- */
const JOURNAL=[
  {id:'amanita',kind:'shroom',name:'Fly agaric',sub:'Amanita muscaria',hint:'Grows out in the open moss.',note:'Red cap, white warts left over from the veil it hatched out of. Lives wrapped around tree roots, trading sugars for minerals. Beautiful and poisonous. Look, don\'t taste.'},
  {id:'chanterelle',kind:'shroom',name:'Pacific golden chanterelle',sub:'Cantharellus formosus',hint:'Low in the moss, toward the front of the clearing.',note:'The ridges under the cap aren\'t true gills; they run down the stem like melted wax. Smells faintly of apricots. BC\'s provincial mushroom.'},
  {id:'inkcap',kind:'shroom',name:'Shaggy ink cap',sub:'Coprinus comatus',hint:'Tall and pale, out in the moss.',note:'Digests itself from the bottom up, dripping black ink to free its spores. People once wrote with the ink. Blink and it\'s gone.'},
  {id:'morel',kind:'shroom',name:'Morel',sub:'Morchella sp.',hint:'A honeycomb cap somewhere in the moss.',note:'Hollow inside, ridged and pitted outside. In the BC interior they flush hard the spring after a forest fire.'},
  {id:'mycena',kind:'shroom',name:'Ghost mycena',sub:'Mycena sp. (unrecorded)',hint:'By the pond, best after dark.',note:'Glows a faint green through the night. Glowing mycenas usually live in warmer forests. Nobody told this one.'},
  {id:'oyster',kind:'shroom',name:'Oyster mushroom',sub:'Pleurotus ostreatus',hint:'On the fallen log.',note:'Pale fans eating the log from the inside. It also traps and digests tiny roundworms in the wood, which is more than most mushrooms can say.'},
  {id:'turkey',kind:'shroom',name:'Turkey tail',sub:'Trametes versicolor',hint:'On the old stump.',note:'Banded like a fanned tail. Pores instead of gills, tough as leather. One of the forest\'s quiet recyclers.'},
  {id:'hericium',kind:'shroom',name:'Bear\'s head tooth',sub:'Hericium abietis',hint:'Never planted. The wind brings it to old wood, after rain.',note:'Lion\'s mane\'s conifer cousin. No cap, no gills, just tiers of soft white spines hanging off old wood. It only turns up in the wet months, and only if it wants to.'},
  {id:'lantern',kind:'shroom',name:'Lantern cap',sub:'Not in any field guide',hint:'Some spores scattered near the cedars don\'t come back the same.',note:'Glows magenta, only after dark, and pulses in time with something past the cedars. You didn\'t grow this. Someone else did.'},
  {id:'frog',kind:'sight',name:'The pond frog',sub:'West edge of the pond',hint:'Something lives at the edge of the pond.',note:'Croaks on its own schedule, which is not the beat\'s schedule. Has never once moved.'},
  {id:'owl',kind:'sight',name:'The owl',sub:'High in the canopy',hint:'Look up, after dark.',note:'Only its eyes, only at night. It has watched every one of your visits.'},
  {id:'folk',kind:'sight',name:'Shadow folk',sub:'At the edges of the clearing',hint:'Something in the shadows is watching.',note:'Small, dark, glowing eyes. They come for the music and stay for the moss. Shy, but they always come back.'},
  {id:'dancers',kind:'sight',name:'The dancers',sub:'Past the cedars',hint:'Follow the music.',note:'Five of them. Always five. They have never turned around.'},
  {id:'fireflies',kind:'sight',name:'Fireflies',sub:'Everywhere, sort of',hint:'Reach up toward the dark.',note:'They gather when you reach toward them and wander off the moment you stop.'},
  {id:'meteor',kind:'sight',name:'Shooting star',sub:'Over the clearing, after dark',hint:'Watch the sky on a dark night. Tap one to make a wish.',note:'Comet dust smaller than a grain of sand, burning up 100 km overhead. They fall thickest during meteor showers: the Perseids in August, the Orionids in October (left behind by Halley\'s Comet), and the Geminids in December.'},
  {id:'web',kind:'sight',name:'The wood wide web',sub:'Below the moss',hint:'Swipe up on the clearing to look underneath.',note:'Every mushroom above is only the fruit. The organism is down here: threads finer than hair, wrapped around the cedar roots, trading sugar for water and passing signals through the soil.'},
  {id:'worm',kind:'sight',name:'Earthworm',sub:'In the topsoil',hint:'Something wriggles below the moss.',note:'Eats its way through dead leaves and leaves the soil better than it found it. Has no opinion about the music.'},
  {id:'glowstick',kind:'sight',name:'Something buried',sub:'Deep, toward the cedars',hint:'Something glows down there, on the side nearest the music.',note:'A glow stick, still faintly glowing. Glow sticks last a night, maybe two. Nobody knows how long this one has been down here, or who dropped it.'},
  {id:'rain',kind:'sight',name:'Rain in the hollow',sub:'Comes and goes',hint:'Wait for a wet spell.',note:'Rain is when the grove does its real work. Flushes come thicker after a wet spell, and the bear\'s head tooth only arrives after one.'}
];
const JBY={};for(const j of JOURNAL)JBY[j.id]=j;
function note(id,quiet){
  let e=state.journal[id];const isNew=!e;
  if(!e)e=state.journal[id]={first:Date.now(),looks:0};
  e.looks++;save();
  if(isNew){const msg=`Added to your field journal: ${JBY[id].name}.`,tryS=()=>performance.now()-lastSayAt<3500?setTimeout(tryS,1500):say(msg);if(!quiet)setTimeout(tryS,2400);document.getElementById('jbtn').classList.add('new');}
  return isNew;
}

/* ---------- colonies: spores that took, growing in their own time ---------- */
const INCUB={amanita:30,chanterelle:40,inkcap:14,morel:36,mycena:20,oyster:18,turkey:30,hericium:36,lantern:24}; // hours under the moss
const CHUNK=6*HOUR,WIND_BLOCK=8*HOUR;
const WIND_POOL=['amanita','chanterelle','inkcap','morel','mycena','oyster','turkey','amanita','chanterelle','mycena','inkcap'];
const colonyLife=c=>INCUB[c.sp]*HOUR+(c.src==='you'?5:4)*24*HOUR;
function colonyState(c,now){
  const age=now-c.born,inc=INCUB[c.sp]*HOUR;
  if(age<0)return null;
  if(age<inc)return{hidden:true,q:age/inc};
  if(age>colonyLife(c))return 'gone';
  const t=age-inc,k=Math.floor(t/CHUNK),ph=(t-k*CHUNK)/CHUNK;
  // the first flush always comes; after that, wet weather makes flushes likelier
  const p=k===0||c.sp==='lantern'?1:0.34+0.55*rainAround(c.born+inc+k*CHUNK);
  if(hash(c.id*13.1+k*7.3)>=p)return null;
  const st=cycleState(ph);if(!st)return null;
  st.k=k;return st;
}
function safePlace(sp,r1,r2){
  if(sp==='turkey'&&r2<0.5)return{a:'stump',side:r1<0.5?-1:1};
  if(WOOD[sp])return{a:'log',f:0.1+r1*0.8};
  const pos={a:'g',nx:0.08+r1*0.84,ny:0.14+r2*0.8};
  for(let i=0;i<4;i++){const p={x:pos.nx*W,y:G.gy+pos.ny*G.gh};if(!inPond0(p.x,p.y)&&!onLog0(p.x,p.y))break;pos.nx=0.08+((pos.nx-0.08+0.29)%0.84);pos.ny=0.14+((pos.ny-0.14+0.37)%0.8);}
  return pos;
}
function pruneColonies(){const now=Date.now(),n=state.colonies.length;state.colonies=state.colonies.filter(c=>colonyState(c,now)!=='gone');return n!==state.colonies.length;}
function addColony(c){pruneColonies();if(state.colonies.length>=14){const i=state.colonies.findIndex(x=>x.src==='wind');state.colonies.splice(i>=0?i:0,1);}c.id=c.id||Math.floor(Math.random()*1e9);state.colonies.push(c);save();}
function windSow(){
  const now=Date.now(),cur=Math.floor(now/WIND_BLOCK);let b=Math.max(Math.floor(state.lastWind/WIND_BLOCK),cur-9);
  for(;b<cur;b++){if(hash(b*7.77+0.13)>=0.5)continue;
    const t=b*WIND_BLOCK+hash(b*3.1)*WIND_BLOCK,wet=rainy(t)||rainy(t-RAIN_BLOCK);
    let sp=WIND_POOL[Math.floor(hash(b*5.3)*WIND_POOL.length)];if(wet&&hash(b*9.1)<0.4)sp='hericium';
    if(!state.colonies.some(c=>c.id===b))addColony(Object.assign({id:b,sp,born:t,src:'wind'},safePlace(sp,hash(b*2.2),hash(b*4.4))));}
  state.lastWind=Math.max(state.lastWind,cur*WIND_BLOCK);pruneColonies();save();
}
function whereIs(c){if(c.a==='log')return'on the log';if(c.a==='stump')return'on the stump';if(c.ny<0.18&&c.nx<0.4)return'out by the cedars';return c.nx<0.36?'on the left side of the clearing':c.nx>0.64?'over on the right':'in the middle of the clearing';}

function cycleState(p){
  if(p<0.12||p>=0.9)return null;
  if(p<0.22)return{g:0.12+(p-0.12)/0.1*0.18,d:0,stage:'pin'};
  if(p<0.42){const q=(p-0.22)/0.2;return{g:0.3+0.7*(1-(1-q)*(1-q)),d:0,stage:'growing'};}
  if(p<0.78)return{g:1,d:0,stage:'mature'};
  return{g:1,d:(p-0.78)/0.12,stage:'decay'};
}
/* ---------- the clearing in 3D: x across, z front-to-back; you can walk around it ---------- */
let rotY=0,rotShown=0; // how far you've walked around (radians): the target, and the eased value drawn
const ROT_MAX=1.0;
const DEPTH=()=>W*0.7;
const zFromY=y=>((y-G.gy)/G.gh-0.5)*DEPTH();
// where something sits in the world
function wpos(s){
  const {log,stump,pond}=G;
  if(s.a==='log')return{x:log.x0+(log.x1-log.x0)*s.f,z:zFromY(log.y),lift:2};
  if(s.a==='stump')return{x:stump.x+s.side*Math.floor(stump.w/2),z:zFromY(stump.y),lift:3};
  if(s.a==='pond')return{x:pond.cx+Math.cos(s.ang)*(pond.rx+4),z:zFromY(pond.cy)+Math.sin(s.ang)*(pond.rx+4),lift:0};
  return{x:s.nx*W,z:(s.ny-0.5)*DEPTH(),lift:0};
}
// ...and where that lands on screen from the current angle (shared by both views)
function projX(x,z){return W/2+(x-W/2)*Math.cos(rotShown)+z*Math.sin(rotShown);}
function projDu(x,z){return(-(x-W/2)*Math.sin(rotShown)+z*Math.cos(rotShown))/DEPTH()+0.5;} // 0 back edge, 1 front edge
function projD(x,z){return clamp(projDu(x,z),0,1);}
function groundY(dn){return dn>=0?G.gy+dn*G.gh:G.gy+dn*G.gh*0.15;}
function screenToGround(x,y){const d=((y-G.gy)/G.gh-0.5)*DEPTH(),c=Math.cos(rotShown),sn=Math.sin(rotShown),xr=x-W/2;
  return{a:'g',nx:clamp((xr*c-d*sn+W/2)/W,0.03,0.97),ny:clamp((xr*sn+d*c)/DEPTH()+0.5,0.02,0.99)};}
const V={log:{},stump:{},pond:{},party:{}};
function updateView(){
  const {log,stump,pond,party}=G,lz=zFromY(log.y);
  V.log={ax:projX(log.x0,lz),ay:groundY(projDu(log.x0,lz)),bx:projX(log.x1,lz),by:groundY(projDu(log.x1,lz)),h:log.h};
  const sz=zFromY(stump.y);V.stump={x:projX(stump.x,sz),y:groundY(projDu(stump.x,sz)),w:stump.w,h:stump.h};
  const pz=zFromY(pond.cy);V.pond={cx:projX(pond.cx,pz),cy:groundY(projDu(pond.cx,pz)),rx:pond.rx,ry:pond.ry};
  const qz=-1.25*DEPTH();V.party={x:projX(party.x,qz),y:G.gy,fade:clamp((0.3-projDu(party.x,qz))/0.3,0,1)};
}
function logParam(x,y){const l=V.log,dx=l.bx-l.ax,dy=l.by-l.ay;return clamp(((x-l.ax)*dx+(y-l.ay)*dy)/(dx*dx+dy*dy||1),0,1);}
function spotPos(s){
  if(s.a==='pond'){const a=s.ang-rotShown,y=V.pond.cy+Math.sin(a)*(V.pond.ry+4);return{x:Math.round(V.pond.cx+Math.cos(a)*(V.pond.rx+4)),y:Math.round(y),k:y};}
  if(s.a==='log'){const l=V.log,x=l.ax+(l.bx-l.ax)*s.f,y=l.ay+(l.by-l.ay)*s.f;return{x:Math.round(x),y:Math.round(y-2),k:y+0.2};}
  if(s.a==='stump')return{x:Math.round(V.stump.x+s.side*Math.floor(V.stump.w/2)),y:Math.round(V.stump.y-3),k:V.stump.y+0.2};
  const w=wpos(s),y=groundY(projDu(w.x,w.z));return{x:Math.round(projX(w.x,w.z)),y:Math.round(y),k:y};
}
function frogPos(){const a=Math.PI-rotShown;return{x:Math.round(V.pond.cx+Math.cos(a)*(V.pond.rx+1)),y:Math.round(V.pond.cy+Math.sin(a)*(V.pond.ry+1)-1)};}

  // spore prints: the collection
  const ph=document.createElement('h3');ph.className='jsec';ph.textContent='Spore prints';jList.appendChild(ph);
  const pp=document.createElement('p');pp.className='jhint';pp.textContent=pn===shrooms.length?'Every print the hollow has to give. It keeps growing without you, as it always did.':'Take a print by tapping a mushroom in its prime.';jList.appendChild(pp);
  const grid=document.createElement('div');grid.className='pgrid';
  for(const j of shrooms){const p=state.prints[j.id],cell=document.createElement('figure');cell.className='pcell'+(p?'':' locked');
    const c=document.createElement('canvas');c.width=24;c.height=24;c.className='pprint';if(p)drawPrint(c.getContext('2d'),j.id);cell.appendChild(c);
    const fc=document.createElement('figcaption');fc.textContent=p?j.name:'Not yet taken';if(p){const s=document.createElement('small');s.textContent=`× ${p.count}`;fc.append(s);}
    cell.appendChild(fc);grid.appendChild(cell);}
  jList.appendChild(grid);
  for(const [kind,label] of [['shroom','Mushrooms'],['sight','Sightings']]){
    const h=document.createElement('h3');h.className='jsec';h.textContent=label;jList.appendChild(h);
    for(const j of JOURNAL.filter(e=>e.kind===kind)){
      const e=state.journal[j.id],row=document.createElement('article');row.className='jentry'+(e?'':' locked');
      row.appendChild(sketch(j,!!e));
      const txt=document.createElement('div');txt.className='jtext';
      if(e){txt.innerHTML='<h4></h4><p class="jsub"></p><p class="jnote"></p><p class="jmeta"></p>';
        txt.querySelector('h4').textContent=j.name;txt.querySelector('.jsub').textContent=j.sub;txt.querySelector('.jnote').textContent=j.note;
        const w=e.wishes||0;
        txt.querySelector('.jmeta').textContent=j.id==='meteor'?`First seen ${fmtDate(e.first)} · ${e.looks} seen · ${w} wish${w===1?'':'es'} made`:`First noted ${fmtDate(e.first)} · looked ${e.looks} time${e.looks===1?'':'s'}`;}
      else{txt.innerHTML='<h4>Not yet noted</h4><p class="jnote"></p>';txt.querySelector('.jnote').textContent=j.hint;}
      row.appendChild(txt);jList.appendChild(row);
    }
  }
}
function openJournal(){renderJournal();jPanel.hidden=false;jBtn.classList.remove('new');document.getElementById('jclose').focus();}
function closeJournal(){jPanel.hidden=true;jBtn.focus();}
jBtn.addEventListener('click',openJournal);
document.getElementById('jclose').addEventListener('click',closeJournal);
jPanel.addEventListener('pointerdown',ev=>{if(ev.target===jPanel)closeJournal();});
addEventListener('keydown',ev=>{if(ev.key==='Escape'&&!jPanel.hidden)closeJournal();});

/* ---------- entering ---------- */
let entered=false;
const gate=document.getElementById('gate');
function enter(withSound){
  entered=true;gate.hidden=true;
  if(withSound)setSound(true);
  try{navigator.wakeLock&&navigator.wakeLock.request('screen').catch(()=>{});}catch(e){}
  setTimeout(()=>{say(prevVisit&&Date.now()-prevVisit>2*60000?awayLine(prevVisit):'Tap the moss, the mushrooms, the shadows. Or just sit.',8000);},900);
  if(!state.turnTip)setTimeout(()=>{if(!state.turnTip)say('Drag sideways to walk around the clearing.',7000);},11000);
  save();
}
document.getElementById('enterSound').addEventListener('click',()=>enter(true));
document.getElementById('enterQuiet').addEventListener('click',()=>enter(false));
sndBtn.addEventListener('click',()=>setSound(!audioOn));

let hiddenAt=0;
document.addEventListener('visibilitychange',()=>{
  if(document.hidden){hiddenAt=Date.now();save();if(actx)actx.suspend();}
  else{windSow();if(actx&&audioOn)actx.resume();try{navigator.wakeLock&&entered&&navigator.wakeLock.request('screen').catch(()=>{});}catch(e){}if(entered&&hiddenAt&&Date.now()-hiddenAt>5*60000)say(awayLine(hiddenAt),8000);}
});
setInterval(save,30000);
addEventListener('pagehide',save);
addEventListener('resize',layout);

layout();
windSow();
updateHeld();
setInterval(windSow,60000);
updateStatus();
requestAnimationFrame(t=>{lastFrame=t;frame(t);});
})();
</script>
