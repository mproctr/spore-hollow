<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="A pixel-art mushroom grove that keeps growing while you're away.">
<meta name="theme-color" content="#06080b">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Spore Hollow</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600&family=Silkscreen&display=swap">
<style>
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; }
body { font: 14px/1.4 system-ui, sans-serif; }
[hidden] { display: none !important; }
/* Layout: one fixed pixel-art clearing filling the screen; HUD floats in the safe-area gutters. Single night look by design. */
:root {
  --void: #06080b;
  --ink: #dbe6d2;
  --dim: #8a9a8f;
  --glow: #8ff7d0;
  --cap: #e0563f;
  --party: #ff5fbf;
  --panel: rgba(6, 9, 12, 0.62);
  --paper: #141a15;
  --rule: rgba(143, 247, 208, 0.05);
  --rule-strong: rgba(219, 230, 210, 0.16);
  --binding: #3a2c22;
  --sketch-bg: #0b1210;
  --display: 'Pixelify Sans', ui-monospace, 'Courier New', monospace;
  --label: 'Silkscreen', ui-monospace, 'Courier New', monospace;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  background: var(--void);
  color: var(--ink);
  overflow: hidden;
  touch-action: manipulation;
  -webkit-user-select: none;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
}
#stage {
  position: fixed; inset: 0;
  display: grid; place-items: center;
  background: var(--void);
  overflow: hidden;
}
#cv {
  display: block;
  image-rendering: pixelated;
  image-rendering: crisp-edges;
  cursor: pointer;
}
.hud {
  position: fixed; left: 0; right: 0;
  display: flex; justify-content: space-between; align-items: flex-start; gap: 12px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  pointer-events: none;
}
.hud.top { top: 0; padding-top: calc(env(safe-area-inset-top, 0px) + 12px); }
.hud.bottom { bottom: 0; justify-content: center; padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 20px); }
.brand { display: grid; gap: 4px; min-width: 0; }
.brand b {
  font: 400 11px/1 var(--label);
  letter-spacing: 0.08em; text-transform: uppercase;
  color: var(--ink); opacity: 0.8;
  text-shadow: 0 1px 0 #000;
}
#status {
  font: 400 10px/1 var(--label);
  letter-spacing: 0.08em; text-transform: uppercase;
  color: var(--dim);
  text-shadow: 0 1px 0 #000;
}
.hbtns { display: flex; gap: 8px; pointer-events: auto; }
.hbtn {
  position: relative;
  pointer-events: auto;
  font: 400 10px/1 var(--label);
  letter-spacing: 0.08em; text-transform: uppercase;
  color: var(--ink);
  background: var(--panel);
  border: 1px solid rgba(143, 247, 208, 0.28);
  padding: 9px 11px; min-height: 34px;
  border-radius: 0;
  cursor: pointer;
}
#snd[aria-pressed="true"] { border-color: var(--glow); color: var(--glow); }
#jbtn.new::after { content: ""; position: absolute; top: -3px; right: -3px; width: 6px; height: 6px; background: var(--cap); box-shadow: 0 0 6px var(--cap); }
#journal {
  position: fixed; inset: 0; z-index: 5;
  display: grid; place-items: center;
  background: rgba(3, 5, 7, 0.72);
  padding: calc(env(safe-area-inset-top, 0px) + 16px) max(16px, env(safe-area-inset-right, 0px)) calc(env(safe-area-inset-bottom, 0px) + 16px) max(16px, env(safe-area-inset-left, 0px));
}
.jbook {
  width: min(560px, 100%);
  max-height: 100%;
  overflow-y: auto;
  overscroll-behavior: contain;
  background: var(--paper);
  background-image: repeating-linear-gradient(to bottom, transparent 0 27px, var(--rule) 27px 28px);
  border: 2px solid var(--binding);
  box-shadow: 0 0 0 2px #000, 6px 6px 0 #000;
  padding: 0 18px 22px;
}
.jhead {
  position: sticky; top: 0; z-index: 1;
  display: flex; justify-content: space-between; align-items: center; gap: 12px;
  background: var(--paper);
  padding: 16px 0 12px;
  border-bottom: 2px solid var(--binding);
}
.jhead h2 { margin: 0 0 4px; font: 600 24px/1 var(--display); color: var(--ink); }
#jcount { font: 400 10px/1 var(--label); letter-spacing: 0.08em; text-transform: uppercase; color: var(--glow); }
.jsec { margin: 22px 0 6px; font: 400 10px/1 var(--label); letter-spacing: 0.1em; text-transform: uppercase; color: var(--dim); }
.jentry {
  display: grid; grid-template-columns: 72px minmax(0, 1fr); gap: 14px; align-items: start;
  padding: 14px 0;
  border-top: 1px dashed var(--rule-strong);
}
.jsketch { width: 72px; height: 60px; image-rendering: pixelated; background: var(--sketch-bg); border: 1px solid var(--rule-strong); }
.jtext { display: grid; gap: 4px; min-width: 0; }
.jtext h4 { margin: 0; font: 600 18px/1.15 var(--display); color: var(--ink); text-wrap: balance; }
.jtext p { margin: 0; }
.jsub { font: 400 14px/1.2 var(--display); font-style: italic; color: var(--glow); opacity: 0.85; }
.jnote { font: 400 15px/1.4 var(--display); color: var(--ink); opacity: 0.88; }
.jmeta { margin-top: 4px !important; font: 400 9px/1.4 var(--label); letter-spacing: 0.08em; text-transform: uppercase; color: var(--dim); font-variant-numeric: tabular-nums; }
.jentry.locked h4 { color: var(--dim); font-size: 15px; }
.jentry.locked .jnote { color: var(--dim); font-style: italic; }
#log {
  font: 400 16px/1.35 var(--display);
  color: var(--ink);
  text-align: center;
  max-width: 30ch;
  text-wrap: balance;
  text-shadow: 0 1px 0 #000, 0 0 8px rgba(0,0,0,0.8);
  opacity: 0;
  transition: opacity 1.2s ease;
}
#gate {
  position: fixed; inset: 0;
  display: grid; place-items: center;
  background: rgba(4, 6, 9, 0.58);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.gate-inner { display: grid; gap: 18px; justify-items: center; text-align: center; max-width: 320px; }
.gate-inner h1 {
  margin: 0;
  font: 600 46px/0.95 var(--display);
  letter-spacing: 0.01em;
  color: var(--ink);
  text-wrap: balance;
  text-shadow: 0 3px 0 #000, 0 0 24px rgba(143, 247, 208, 0.25);
}
.gate-inner h1 span { color: var(--glow); }
.gate-inner p {
  margin: 0;
  font: 400 16px/1.4 var(--display);
  color: var(--dim);
  text-wrap: balance;
}
.gate-actions { display: grid; gap: 10px; width: 100%; margin-top: 6px; }
.gate-actions button {
  font: 400 12px/1 var(--label);
  letter-spacing: 0.08em; text-transform: uppercase;
  padding: 15px 16px;
  border-radius: 0;
  cursor: pointer;
}
#enterSound { background: var(--glow); color: #04120c; border: 0; box-shadow: 0 4px 0 #2d7d63; }
#enterSound:active { transform: translateY(2px); box-shadow: 0 2px 0 #2d7d63; }
#enterQuiet { background: transparent; color: var(--ink); border: 1px solid rgba(219, 230, 210, 0.3); }
button:focus-visible { outline: 2px solid var(--cap); outline-offset: 3px; }
.hint { font: 400 10px/1.5 var(--label); letter-spacing: 0.08em; text-transform: uppercase; color: var(--dim); opacity: 0.8; }
</style>
</head>
<body>
<div id="stage"><canvas id="cv" aria-label="A mossy night grove where mushrooms grow on their own"></canvas></div>

<div class="hud top">
  <div class="brand"><b>Spore Hollow</b><span id="status">Night</span></div>
  <div class="hbtns">
    <button id="jbtn" class="hbtn" type="button">Journal</button>
    <button id="snd" class="hbtn" type="button" aria-pressed="false">Sound off</button>
  </div>
</div>

<div id="journal" hidden role="dialog" aria-modal="true" aria-labelledby="jtitle">
  <div class="jbook">
    <header class="jhead">
      <div><h2 id="jtitle">Field Journal</h2><span id="jcount"></span></div>
      <button id="jclose" class="hbtn" type="button">Close</button>
    </header>
    <div id="jlist"></div>
  </div>
</div>
<div class="hud bottom"><div id="log" role="status" aria-live="polite"></div></div>

<div id="gate">
  <div class="gate-inner">
    <h1>Spore<br><span>Hollow</span></h1>
    <p>A clearing that grows while you're gone. Something is dancing past the cedars.</p>
    <div class="gate-actions">
      <button id="enterSound" type="button">Enter with sound</button>
      <button id="enterQuiet" type="button">Enter quietly</button>
    </div>
    <span class="hint">Headphones help</span>
  </div>
</div>

<script>
(() => {
'use strict';
const cv = document.getElementById('cv');
let ctx = cv.getContext('2d');
const bg = document.createElement('canvas');
const bctx = bg.getContext('2d');
const logEl = document.getElementById('log');
const statusEl = document.getElementById('status');
const sndBtn = document.getElementById('snd');
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

let W = 200, H = 400, S = 2, G = {};

/* ---------- helpers ---------- */
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function hash(n){const x=Math.sin(n*12.9898)*43758.5453;return x-Math.floor(x);}
const BAYER=[[0,8,2,10],[12,4,14,6],[3,11,1,9],[15,7,13,5]];
const mix=(a,b,t)=>[a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t,a[2]+(b[2]-a[2])*t];
const rgb=(c,a)=>a===undefined?`rgb(${c[0]|0},${c[1]|0},${c[2]|0})`:`rgba(${c[0]|0},${c[1]|0},${c[2]|0},${a})`;
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const shade=(c,f)=>[c[0]*f,c[1]*f,c[2]*f];
const BROWN=[64,48,38];
function R(x,y,w,h,c,a){ctx.fillStyle=rgb(c,a);ctx.fillRect(Math.round(x),Math.round(y),w,h);}
function glow(x,y,r,c,a){if(a<=0.01||r<=0)return;const g=ctx.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,rgb(c,a));g.addColorStop(1,rgb(c,0));ctx.fillStyle=g;ctx.fillRect(x-r,y-r,r*2,r*2);}

/* ---------- the real sky over Vernon, BC ---------- */
const SITE={lat:50.267,lon:-119.272};
function sunAltitude(ms){
  const rad=Math.PI/180,d=(ms-946728000000)/86400000; // days since J2000
  const g=(357.529+0.98560028*d)*rad,q=280.459+0.98564736*d;
  const lng=(q+1.915*Math.sin(g)+0.020*Math.sin(2*g))*rad,e=(23.439-0.00000036*d)*rad;
  const ra=Math.atan2(Math.cos(e)*Math.sin(lng),Math.cos(lng)),dec=Math.asin(Math.sin(e)*Math.sin(lng));
  const gmst=((18.697374558+24.06570982441908*d)%24+24)%24;
  const ha=(gmst*15+SITE.lon)*rad-ra,lat=SITE.lat*rad;
  return Math.asin(Math.sin(lat)*Math.sin(dec)+Math.cos(lat)*Math.cos(dec)*Math.cos(ha))/rad;
}
const SHOWERS=[
  {name:'Quadrantids',m:0,d:3,w:0.6,k:0.8},{name:'Lyrids',m:3,d:22,w:1.2,k:0.4},
  {name:'Eta Aquariids',m:4,d:6,w:3,k:0.45},{name:'Perseids',m:7,d:12,w:3,k:1},
  {name:'Orionids',m:9,d:21,w:3,k:0.6},{name:'Leonids',m:10,d:17,w:1.5,k:0.4},
  {name:'Geminids',m:11,d:14,w:2,k:1}
];
function activeShower(now){
  const y=new Date(now).getFullYear();let best=null,bi=0;
  for(const s of SHOWERS)for(const yr of [y-1,y,y+1]){const days=(now-new Date(yr,s.m,s.d,4).getTime())/864e5;const i=s.k*Math.exp(-(days*days)/(2*s.w*s.w));if(i>bi){bi=i;best=s;}}
  return bi>0.08?{name:best.name,i:bi,dir:hash(best.name.length*7.7)<0.5?-1:1,ang:0.45+hash(best.name.length*3.1)*0.25}:null;
}
let skyCache={t:0};
function sky(){const now=Date.now();if(now-skyCache.t>5000){const alt=sunAltitude(now);skyCache={t:now,alt,rising:sunAltitude(now+6e5)>alt,sh:activeShower(now)};}return skyCache;}
function smooth(a,b,x){const t=clamp((x-a)/(b-a),0,1);return t*t*(3-2*t);}
function lightLevel(){return smooth(-9,12,sky().alt);}
function warmth(){return clamp(1-Math.abs(sky().alt-1)/7,0,1);}

/* ---------- persistence ---------- */
const KEY='spore-hollow-v1';
function load(){try{return JSON.parse(localStorage.getItem(KEY))||{};}catch(e){return {};}}
const state=load();
const prevVisit=state.last||null;
state.first=state.first||Date.now();
state.planted=Array.isArray(state.planted)?state.planted:[];
state.journal=state.journal&&typeof state.journal==='object'?state.journal:{};
function save(){try{localStorage.setItem(KEY,JSON.stringify({first:state.first,last:Date.now(),planted:state.planted,journal:state.journal}));}catch(e){}}

/* ---------- field journal ---------- */
const JOURNAL=[
  {id:'amanita',kind:'shroom',name:'Fly agaric',sub:'Amanita muscaria',hint:'Grows out in the open moss.',note:'Red cap, white warts left over from the veil it hatched out of. Lives wrapped around tree roots, trading sugars for minerals. Beautiful and poisonous. Look, don\'t taste.'},
  {id:'chanterelle',kind:'shroom',name:'Pacific golden chanterelle',sub:'Cantharellus formosus',hint:'Low in the moss, toward the front of the clearing.',note:'The ridges under the cap aren\'t true gills; they run down the stem like melted wax. Smells faintly of apricots. BC\'s provincial mushroom.'},
  {id:'inkcap',kind:'shroom',name:'Shaggy ink cap',sub:'Coprinus comatus',hint:'Tall and pale, out in the moss.',note:'Digests itself from the bottom up, dripping black ink to free its spores. People once wrote with the ink. Blink and it\'s gone.'},
  {id:'morel',kind:'shroom',name:'Morel',sub:'Morchella sp.',hint:'A honeycomb cap somewhere in the moss.',note:'Hollow inside, ridged and pitted outside. In the BC interior they flush hard the spring after a forest fire.'},
  {id:'mycena',kind:'shroom',name:'Ghost mycena',sub:'Mycena sp. (unrecorded)',hint:'By the pond, best after dark.',note:'Glows a faint green through the night. Glowing mycenas usually live in warmer forests. Nobody told this one.'},
  {id:'oyster',kind:'shroom',name:'Oyster mushroom',sub:'Pleurotus ostreatus',hint:'On the fallen log.',note:'Pale fans eating the log from the inside. It also traps and digests tiny roundworms in the wood, which is more than most mushrooms can say.'},
  {id:'turkey',kind:'shroom',name:'Turkey tail',sub:'Trametes versicolor',hint:'On the old stump.',note:'Banded like a fanned tail. Pores instead of gills, tough as leather. One of the forest\'s quiet recyclers.'},
  {id:'frog',kind:'sight',name:'The pond frog',sub:'West edge of the pond',hint:'Something lives at the edge of the pond.',note:'Croaks on its own schedule, which is not the beat\'s schedule. Has never once moved.'},
  {id:'owl',kind:'sight',name:'The owl',sub:'High in the canopy',hint:'Look up, after dark.',note:'Only its eyes, only at night. It has watched every one of your visits.'},
  {id:'folk',kind:'sight',name:'Shadow folk',sub:'At the edges of the clearing',hint:'Something in the shadows is watching.',note:'Small, dark, glowing eyes. They come for the music and stay for the moss. Shy, but they always come back.'},
  {id:'dancers',kind:'sight',name:'The dancers',sub:'Past the cedars',hint:'Follow the music.',note:'Five of them. Always five. They have never turned around.'},
  {id:'fireflies',kind:'sight',name:'Fireflies',sub:'Everywhere, sort of',hint:'Reach up toward the dark.',note:'They gather when you reach toward them and wander off the moment you stop.'},
  {id:'meteor',kind:'sight',name:'Shooting star',sub:'Over the clearing, after dark',hint:'Watch the sky on a dark night. Tap one to make a wish.',note:'Comet dust smaller than a grain of sand, burning up 100 km overhead. They fall thickest during meteor showers: the Perseids in August, the Orionids in October (left behind by Halley\'s Comet), and the Geminids in December.'}
];
const JBY={};for(const j of JOURNAL)JBY[j.id]=j;
function note(id){
  let e=state.journal[id];const isNew=!e;
  if(!e)e=state.journal[id]={first:Date.now(),looks:0};
  e.looks++;save();
  if(isNew){setTimeout(()=>say(`Added to your field journal: ${JBY[id].name}.`),2400);document.getElementById('jbtn').classList.add('new');}
}

/* ---------- the grove's fixed mushroom spots ---------- */
const SPOTS=[
  {id:1,sp:'oyster',a:'log',f:0.24},{id:2,sp:'oyster',a:'log',f:0.52},{id:3,sp:'oyster',a:'log',f:0.8},
  {id:4,sp:'turkey',a:'stump',side:-1},{id:5,sp:'turkey',a:'stump',side:1},
  {id:6,sp:'mycena',a:'pond',ang:-2.35},{id:7,sp:'mycena',a:'pond',ang:-0.75},{id:8,sp:'mycena',a:'pond',ang:0.55},
  {id:9,sp:'amanita',a:'g',nx:0.31,ny:0.64},{id:10,sp:'amanita',a:'g',nx:0.87,ny:0.74},
  {id:11,sp:'chanterelle',a:'g',nx:0.2,ny:0.86},{id:12,sp:'chanterelle',a:'g',nx:0.47,ny:0.9},
  {id:13,sp:'inkcap',a:'g',nx:0.79,ny:0.43},{id:14,sp:'inkcap',a:'g',nx:0.7,ny:0.93},
  {id:15,sp:'morel',a:'g',nx:0.57,ny:0.3},{id:16,sp:'morel',a:'g',nx:0.1,ny:0.6},
  {id:17,sp:'amanita',a:'g',nx:0.38,ny:0.15}
];
for(const s of SPOTS){s.period=40+hash(s.id*7.1)*70;s.off=hash(s.id*3.3)*s.period;s.key='s'+s.id;}
const NAMES={amanita:'fly agaric',chanterelle:'chanterelle',inkcap:'shaggy ink cap',morel:'morel',mycena:'ghost mycena',oyster:'oyster cluster',turkey:'turkey tail'};
const PENTA=[69,72,74,76,79,81,84];
const NOTE={amanita:0,chanterelle:2,inkcap:4,morel:1,mycena:5,oyster:3,turkey:6};

function cycleState(p){
  if(p<0.12||p>=0.9)return null;
  if(p<0.22)return{g:0.12+(p-0.12)/0.1*0.18,d:0,stage:'pin'};
  if(p<0.42){const q=(p-0.22)/0.2;return{g:0.3+0.7*(1-(1-q)*(1-q)),d:0,stage:'growing'};}
  if(p<0.78)return{g:1,d:0,stage:'mature'};
  return{g:1,d:(p-0.78)/0.12,stage:'decay'};
}
function plantedState(p,tMin){
  const a=tMin-p.t0;
  if(a<0)return null;
  if(a<3)return{speck:true,g:0,d:0,stage:'spore'};
  if(a<12){const q=(a-3)/9;return{g:0.12+0.88*q,d:0,stage:q<0.2?'pin':'growing'};}
  if(a<55)return{g:1,d:0,stage:'mature'};
  if(a<65)return{g:1,d:(a-55)/10,stage:'decay'};
  return 'gone';
}
function spotPos(s){
  const {gy,gh,log,stump,pond}=G;
  if(s.a==='log')return{x:Math.round(log.x0+(log.x1-log.x0)*s.f),y:log.y-2};
  if(s.a==='stump')return{x:stump.x+s.side*Math.floor(stump.w/2),y:stump.y-3};
  if(s.a==='pond')return{x:Math.round(pond.cx+Math.cos(s.ang)*(pond.rx+4)),y:Math.round(pond.cy+Math.sin(s.ang)*(pond.ry+4))};
  return{x:Math.round(s.nx*W),y:Math.round(gy+s.ny*gh)};
}

/* ---------- shadow folk ---------- */
const SPR={
  ears:{rows:['X...X','XX.XX','XXXXX','XXXXX','XXXXX','.X.X.'],eyes:[[1,2],[3,2]]},
  tall:{rows:['.X.','XXX','XXX','XXX','XXX','XXX','XXX','X.X'],eyes:[[0,1],[2,1]]},
  blob:{rows:['..XX..','.XXXX.','XXXXXX','XXXXXX','XXXXXX'],eyes:[[1,1],[4,1]]},
  antler:{rows:['X...X','.X.X.','..X..','.XXX.','XXXXX','XXXXX','XXXXX','.X.X.'],eyes:[[1,4],[3,4]]}
};
const CRIT=[
  {spr:'ears',nx:0.12,ny:0.05,party:1,eye:[255,211,107]},
  {spr:'tall',nx:0.265,ny:0.03,party:1,eye:[184,255,120]},
  {spr:'antler',nx:0.905,ny:0.13,eye:[255,150,92]},
  {spr:'blob',log:1,eye:[150,230,255]}
];
for(const c of CRIT){c.hide=0;c.blink=performance.now()/1000+2+Math.random()*4;}
function critPos(c){
  if(c.log)return{x:Math.round(G.log.x0+(G.log.x1-G.log.x0)*0.64),y:G.log.y-G.log.h+3};
  return{x:Math.round(c.nx*W),y:Math.round(G.gy+c.ny*G.gh)};
}

/* ---------- layout ---------- */
let bgKey=-1,skyMask=new Uint8Array(1),showerAnnounced=false;
const meteors=[];
const WISHES=['You make a wish. The grove keeps it to itself.','Wish made. The moss seems to approve.','You make a wish. Something past the cedars cheers.'];
function spawnMeteor(sh){
  const dir=sh?sh.dir:(Math.random()<0.5?-1:1),a=sh?sh.ang+(Math.random()-0.5)*0.08:0.3+Math.random()*0.5,sp=110+Math.random()*70;
  meteors.push({x:W*(0.15+Math.random()*0.7),y:H*0.15+Math.random()*(G.gy*0.75-H*0.15),vx:Math.cos(a)*sp*dir,vy:Math.sin(a)*sp,len:10+Math.floor(Math.random()*9),life:0.45+Math.random()*0.4,age:0,wished:false});
  if(entered)note('meteor');
}

/* ---------- ambient events ---------- */
const FLAVOR=['Something laughs, far off past the trees.','Damp air settles over the moss.','A moth finds the ghost mycena.','Two eyes watch you from the roots, unbothered.','Somewhere a bass note rolls through the soil.','The log creaks as it cools.'];
let flavorAt=performance.now()/1000+70;
setInterval(()=>{
  if(!entered||document.hidden)return;
  const L=lightLevel(),tS=performance.now()/1000;
  if(L<0.5&&Math.random()<0.35)crickets();
  if(L<0.5&&Math.random()<0.012)owl();
  if(Math.random()<0.02){frogCroak=tS+0.5;croakSound((G.pond.cx/W)*2-1);ripples.push({x:G.pond.cx-G.pond.rx+3,y:G.pond.cy,r:1,life:1});}
  if(tS>flavorAt){say(FLAVOR[Math.floor(Math.random()*FLAVOR.length)]);flavorAt=tS+80+Math.random()*90;}
},1000);

/* ---------- touch ---------- */
function inPond(x,y){const p=G.pond;return((x-p.cx)**2)/((p.rx+1)**2)+((y-p.cy)**2)/((p.ry+1)**2)<=1;}
function onLog(x,y){const l=G.log;return x>=l.x0-2&&x<=l.x1+3&&y>=l.y-l.h-2&&y<=l.y+1;}
function addPulse(x,y){
  const targets=lastList.filter(m=>!m.speck).map(m=>({m,dd:Math.hypot(m.x-x,m.y-y)})).filter(o=>o.dd<95&&o.dd>3).sort((a,b)=>a.dd-b.dd).slice(0,3);
  const t0=performance.now()/1000;
  for(const {m} of targets){const s=[];let px=x,py=y;const n=Math.max(3,Math.round(Math.hypot(m.x-x,m.y-y)/6));
    for(let i=1;i<=n;i++){const tx=x+(m.x-x)*i/n+(i<n?(Math.random()-0.5)*6:0),ty=y+(m.y-y)*i/n+(i<n?(Math.random()-0.5)*3:0);const steps=Math.max(1,Math.round(Math.hypot(tx-px,ty-py)));for(let k=1;k<=steps;k++)s.push([Math.round(px+(tx-px)*k/steps),Math.round(py+(ty-py)*k/steps)]);px=tx;py=ty;}
    pulses.push({s,t0,dur:s.length/45,key:m.key,sp:m.sp,tx:m.x,ty:m.top||m.y});}
  return targets.length;
}
cv.addEventListener('pointerdown',ev=>{
  const r=cv.getBoundingClientRect(),x=(ev.clientX-r.left)/r.width*W,y=(ev.clientY-r.top)/r.height*H,tS=performance.now()/1000,pan=(x/W)*2-1;
  // shooting stars
  for(const m of meteors){if(m.wished||m.age>m.life+0.6)continue;const t=Math.min(m.age,m.life);if(segDist(x,y,m.x,m.y,m.x+m.vx*t,m.y+m.vy*t)<9){m.wished=true;
    const e=state.journal.meteor||(state.journal.meteor={first:Date.now(),looks:1});e.wishes=(e.wishes||0)+1;save();
    emitSpores(x,y,10,[255,250,220]);[0,2,4].forEach((k,i)=>setTimeout(()=>chime(PENTA[k]+12,pan,0.06),i*120));say(WISHES[Math.floor(Math.random()*WISHES.length)]);return;}}
  // shadow folk
  for(const c of CRIT){if(tS<c.hide||!c._pos)continue;if(Math.hypot(c._pos.x-x,c._pos.y-y)<7){c.hide=tS+20+Math.random()*25;blip(pan);say(c.party?'One of them slips back into the dark.':'Someone ducks back into the shadows.');note('folk');return;}}
  // the owl
  if(lightLevel()<0.5&&Math.hypot(x-(Math.round(W*0.84)+3),y-Math.round(H*0.15))<8){owlBlink=tS;owl();say('The owl blinks at you, slowly.');note('owl');return;}
  // the frog
  if(Math.hypot(x-(G.pond.cx-G.pond.rx-1),y-(G.pond.cy-2))<6){frogCroak=tS+0.5;croakSound(pan);ripples.push({x:G.pond.cx-G.pond.rx+3,y:G.pond.cy,r:1,life:1});say('The frog croaks, off the beat.');note('frog');return;}
  // the party
  const p=G.party;if(Math.abs(x-p.x)<24&&y<p.y+10&&y>p.y-60){leanUntil=Date.now()+10000;say('You lean toward the music. It leans back.');note('dancers');return;}
  // mushrooms
  let best=null,bd=10;for(const m of lastList){if(m.speck)continue;const cy=((m.top||m.y)+m.y)/2,dd=Math.hypot(m.x-x,cy-y);if(dd<bd){bd=dd;best=m;}}
  if(best){const nm=NAMES[best.sp];flashes[best.key]=tS;emitSpores(best.x,best.top||best.y,best.stage==='mature'?16:5,best.sp==='mycena'?[140,248,208]:null);chime(PENTA[NOTE[best.sp]],pan,0.1);puff(pan);
    const lines={pin:`A ${nm} pin, barely awake.`,growing:`The ${nm} is still growing.`,mature:`The ${nm} lets go of its spores.`,decay:`The ${nm} is giving itself back to the moss.`};say(lines[best.stage]||nm);note(best.sp);return;}
  // pond
  if(inPond(x,y)){ripples.push({x,y,r:1,life:1});plop(pan);say('Rings cross the pond.');return;}
  // moss
  if(y>G.gy+5&&!onLog(x,y)){const hit=addPulse(x,y);
    const near=state.planted.some(q=>Math.hypot(q.nx*W-x,(G.gy+q.ny*G.gh)-y)<10);
    if(!near){const nearPond=Math.hypot((x-G.pond.cx)/(G.pond.rx+16),(y-G.pond.cy)/(G.pond.ry+12))<1;const opts=['amanita','chanterelle','inkcap','morel'];const sp=nearPond?'mycena':opts[Math.floor(Math.random()*opts.length)];
      state.planted.push({nx:x/W,ny:(y-G.gy)/G.gh,sp,t0:Date.now()/60000});if(state.planted.length>10)state.planted.shift();save();}
    chime(PENTA[Math.floor(Math.random()*3)],pan,0.05);
    say(near?(hit?'The network hums under the moss.':'The moss is quiet here.'):'A spore settles into the moss. Check back in a few minutes.');return;}
  // sky / canopy
  attract={x,y,until:tS+6};chime(PENTA[5+Math.floor(Math.random()*2)]+12,pan,0.04);say('The fireflies drift closer.');note('fireflies');
});

/* ---------- journal panel ---------- */
const jPanel=document.getElementById('journal'),jList=document.getElementById('jlist'),jCount=document.getElementById('jcount'),jBtn=document.getElementById('jbtn');
function withCtx(c2,fn){const old=ctx;ctx=c2;try{fn();}finally{ctx=old;}}
function drawSighting(id){
  const body=[15,19,25];
  if(id==='frog'){const fx=12,fy=15;R(fx-2,fy-2,5,2,[60,104,52]);R(fx-2,fy,2,1,[60,104,52]);R(fx+1,fy,2,1,[60,104,52]);R(fx-1,fy-3,1,1,[200,218,108]);R(fx+1,fy-3,1,1,[200,218,108]);R(fx+2,fy-1,2,2,[190,210,140]);}
  if(id==='owl'){for(let y=5;y<15;y++)R(8,y,9,1,[12,22,20]);R(9,9,2,1,[255,190,80]);R(13,9,2,1,[255,190,80]);ctx.globalCompositeOperation='lighter';glow(10,9.5,3,[255,190,80],0.4);glow(14,9.5,3,[255,190,80],0.4);}
  if(id==='folk'){const s=SPR.ears,x0=10,y0=10;s.rows.forEach((row,j)=>{for(let i=0;i<row.length;i++)if(row[i]==='X')R(x0+i,y0+j,1,1,body);});for(const [ex,ey] of s.eyes)R(x0+ex,y0+ey,1,1,[255,211,107]);}
  if(id==='dancers'){ctx.globalCompositeOperation='lighter';glow(12,12,14,[255,95,191],0.5);ctx.globalCompositeOperation='source-over';for(let i=0;i<5;i++){const x=4+i*4,y=17-(i%2);R(x,y-3,1,3,[4,4,8]);R(x,y-4,1,1,[4,4,8]);}}
  if(id==='meteor'){for(const [x,y] of [[3,15],[20,3],[8,4],[21,16]])R(x,y,1,1,[200,210,240]);ctx.globalCompositeOperation='lighter';for(let k=0;k<13;k++)R(18-k,13-Math.round(k*0.6),1,1,k<2?[255,255,236]:[190,212,255],1-k/13);glow(18,13,3,[255,255,236],0.5);ctx.globalCompositeOperation='source-over';}
  if(id==='fireflies'){ctx.globalCompositeOperation='lighter';for(const [x,y] of [[6,7],[15,5],[11,13],[19,12]]){glow(x,y,4,[210,255,120],0.5);R(x,y,1,1,[240,255,180]);}}
  ctx.globalCompositeOperation='source-over';
}
function sketch(j,known){
  const c=document.createElement('canvas');c.width=24;c.height=20;c.className='jsketch';const c2=c.getContext('2d');
  withCtx(c2,()=>{
    if(j.kind==='shroom'){
      if(j.id==='oyster'){R(0,15,24,5,[50,37,30]);R(0,15,24,1,[56,94,58]);drawShroom('oyster',12,17,1,0,1,1,1,0);}
      else if(j.id==='turkey'){R(4,6,9,14,[50,37,30]);R(4,6,9,1,[120,92,66]);drawShroom('turkey',13,14,1,0,1,1,1,0);}
      else{R(0,17,24,3,[28,58,40]);R(0,17,24,1,[56,94,58]);drawShroom(j.id,12,17,1,0,1,1,1,0);if(j.id==='mycena'&&known){ctx.globalCompositeOperation='lighter';glow(12,12,9,[120,250,200],0.35);ctx.globalCompositeOperation='source-over';}}
    }else drawSighting(j.id);
    if(!known){ctx.globalCompositeOperation='source-in';ctx.fillStyle='#26302a';ctx.fillRect(0,0,24,20);ctx.globalCompositeOperation='source-over';}
  });
  return c;
}
const fmtDate=ms=>new Date(ms).toLocaleDateString(undefined,{month:'short',day:'numeric'});
function renderJournal(){
  jList.textContent='';
  const known=JOURNAL.filter(j=>state.journal[j.id]).length;
  jCount.textContent=`${known} of ${JOURNAL.length} noted`;
  for(const [kind,label] of [['shroom','Mushrooms'],['sight','Sightings']]){
    const h=document.createElement('h3');h.className='jsec';h.textContent=label;jList.appendChild(h);
    for(const j of JOURNAL.filter(e=>e.kind===kind)){
      const e=state.journal[j.id],row=document.createElement('article');row.className='jentry'+(e?'':' locked');
      row.appendChild(sketch(j,!!e));
      const txt=document.createElement('div');txt.className='jtext';
      if(e){txt.innerHTML='<h4></h4><p class="jsub"></p><p class="jnote"></p><p class="jmeta"></p>';
        txt.querySelector('h4').textContent=j.name;txt.querySelector('.jsub').textContent=j.sub;txt.querySelector('.jnote').textContent=j.note;
        const w=e.wishes||0;
        txt.querySelector('.jmeta').textContent=j.id==='meteor'?`First seen ${fmtDate(e.first)} · ${e.looks} seen · ${w} wish${w===1?'':'es'} made`:`First noted ${fmtDate(e.first)} · looked ${e.looks} time${e.looks===1?'':'s'}`;}
      else{txt.innerHTML='<h4>Not yet noted</h4><p class="jnote"></p>';txt.querySelector('.jnote').textContent=j.hint;}
      row.appendChild(txt);jList.appendChild(row);
    }
  }
}
function openJournal(){renderJournal();jPanel.hidden=false;jBtn.classList.remove('new');document.getElementById('jclose').focus();}
function closeJournal(){jPanel.hidden=true;jBtn.focus();}
jBtn.addEventListener('click',openJournal);
document.getElementById('jclose').addEventListener('click',closeJournal);
jPanel.addEventListener('pointerdown',ev=>{if(ev.target===jPanel)closeJournal();});
addEventListener('keydown',ev=>{if(ev.key==='Escape'&&!jPanel.hidden)closeJournal();});

/* ---------- entering ---------- */
let entered=false;
const gate=document.getElementById('gate');
function enter(withSound){
  entered=true;gate.hidden=true;
  if(withSound)setSound(true);
  try{navigator.wakeLock&&navigator.wakeLock.request('screen').catch(()=>{});}catch(e){}
  setTimeout(()=>{say(prevVisit&&Date.now()-prevVisit>2*60000?awayLine(prevVisit):'Tap the moss, the mushrooms, the shadows. Or just sit.',8000);},900);
  save();
}
document.getElementById('enterSound').addEventListener('click',()=>enter(true));
document.getElementById('enterQuiet').addEventListener('click',()=>enter(false));
sndBtn.addEventListener('click',()=>setSound(!audioOn));

let hiddenAt=0;
document.addEventListener('visibilitychange',()=>{
  if(document.hidden){hiddenAt=Date.now();save();if(actx)actx.suspend();}
  else{if(actx&&audioOn)actx.resume();try{navigator.wakeLock&&entered&&navigator.wakeLock.request('screen').catch(()=>{});}catch(e){}if(entered&&hiddenAt&&Date.now()-hiddenAt>5*60000)say(awayLine(hiddenAt),8000);}
});
setInterval(save,30000);
addEventListener('pagehide',save);
addEventListener('resize',layout);

layout();
updateStatus();
requestAnimationFrame(t=>{lastFrame=t;frame(t);});
})();
</script>

if ('serviceWorker' in navigator) {
  addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); });
}
